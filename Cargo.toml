[workspace]
resolver = "2"
members = ["crates/gashuu-core", "crates/gashuu"]

# Dependency debuginfo trim. Profiles are only honoured in the workspace ROOT manifest, and
# until this section existed the workspace declared none at all, so all 441 dependency crates
# that actually compile here linked with `debug = 2`.
#
# The SHAPE of this override was measured, not reasoned about. The obvious
# `[profile.dev.package."*"]` form is a trap: a package override counts as an explicit
# debuginfo setting, so cargo stops weakening it for the build graph and RAISES the ~211
# build-script / proc-macro units (`i-slint-compiler` and friends) from their
# debuginfo-free default up to line tables. That gives back three quarters of the win
# (-121 MiB of target output instead of -493 MiB), and `[profile.dev.build-override]
# debug = false` cannot cancel it, because package overrides are applied AFTER
# build-override. Setting the profile default and re-raising the members instead leaves the
# build graph exactly as cargo intends it.
#
# `line-tables-only` rather than `0` because dependency frames then still carry `file:line`
# in panic backtraces, which is what makes an `image` / `zip` / `slint` panic inside a test
# diagnosable. Measured on a cold `cargo nextest run --workspace --profile ci --no-run` into
# a fresh CARGO_TARGET_DIR: target output 3.52 GiB -> 3.03 GiB (-13.7%). The `test` profile
# inherits all of this, so no `[profile.test]` twin is needed.
[profile.dev]
debug = "line-tables-only"

# The workspace members keep FULL debuginfo, so stepping through and backtracing gashuu's own
# code is unchanged. ADD ANY NEW WORKSPACE MEMBER HERE - the profile default above would
# otherwise silently downgrade it. Cargo warns about a spec matching no package, so a rename
# is caught; a forgotten member is not.
[profile.dev.package.gashuu-core]
debug = 2

[profile.dev.package.gashuu]
debug = 2

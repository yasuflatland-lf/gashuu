name: Pages

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "mise.toml"
      - "mise.web.toml"
      - ".github/workflows/pages.yml"
  # Re-publish the current main on demand.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Pages deployments must land in order; never cancel one mid-flight. At most one
# run waits per group — intermediate pushes are skipped, so the latest always deploys.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  web:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      MISE_ENV: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: jdx/mise-action@7a4e45a543138629540c9a1616d08632b893e492 # v5
      - run: rustup target add wasm32-unknown-unknown
      - run: trunk build --release --public-url /gashuu/app/
        working-directory: crates/gashuu
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: web-app
          path: crates/gashuu/dist
          if-no-files-found: error

  deploy:
    name: deploy (github-pages)
    runs-on: ubuntu-latest
    needs: web
    defaults:
      run:
        working-directory: site
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # node + pnpm come from site/mise.toml (install: false skips the root Rust
      # toolchain). The landing page is a Vite build: site/dist is published.
      - uses: jdx/mise-action@7a4e45a543138629540c9a1616d08632b893e492 # v5
        with:
          install: false
      - run: mise trust && mise install
      - run: mise exec -- pnpm install --frozen-lockfile
      - run: mise run build
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: web-app
          path: site/dist/app
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: site/dist
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5

name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# The dav1d release every from-source build uses (Windows here; macOS + Linux +
# Windows in release.yml). Keep in sync with release.yml's DAV1D_VERSION —
# scripts/check-dav1d-pin.sh enforces it, and Renovate bumps both together.
env:
  # renovate: datasource=github-tags depName=videolan/dav1d
  DAV1D_VERSION: '1.5.5'

# Cancel a superseded run when a new commit lands on the same ref (saves CI minutes).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The Slint-free pure crate: lint + test + coverage in one fast ubuntu job.
  # It never links Slint, so the quality gates return quickly instead of waiting
  # on the GUI build. Coverage uses the default archive and image features.
  core:
    name: core (rust, slint-free)
    runs-on: ubuntu-latest
    # Activate mise.coverage.toml so cargo-llvm-cov is installed here only; the
    # per-OS app jobs (no MISE_ENV) skip it and stay lean. See mise.coverage.toml.
    env:
      MISE_ENV: coverage
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: jdx/mise-action@7a4e45a543138629540c9a1616d08632b893e492 # v5
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # gashuu-core's `image` dep decodes AVIF through the dav1d C library
      # (`avif-native` feature), resolved via pkg-config. Ubuntu 24.04 ships
      # 1.4.1 (>= the 1.3.0 floor). See docs/toolchain.md.
      - run: |
          sudo apt-get update
          sudo apt-get install -y libdav1d-dev
      # Install all three components explicitly on mise's pinned toolchain:
      # llvm-tools-preview (for cargo-llvm-cov; mise.toml omits it) plus rustfmt and
      # clippy. rustfmt/clippy ARE declared in mise.toml, but on a mise cache hit
      # jdx/mise-action restores symlinks WITHOUT re-running `rustup component add`,
      # so they can be missing from ~/.rustup on the runner — keep them here or
      # `cargo fmt --check`/clippy fail in this (coverage) job. Do not drop as "redundant".
      - run: rustup component add rustfmt clippy llvm-tools-preview
      - run: cargo fmt --check
      # `--features testing` so the feature-gated MockPageSource test is linted and run
      # (the old `--workspace` runs got it via feature unification with gashuu's dev-dep).
      - run: cargo clippy -p gashuu-core --all-targets --features testing -- -D warnings
      - run: cargo llvm-cov nextest -p gashuu-core --features testing --profile ci --lcov --output-path lcov.info --ignore-filename-regex 'build\.rs'
      - run: cargo clippy -p gashuu-core --all-targets --no-default-features -- -D warnings
      - run: cargo nextest run -p gashuu-core --no-default-features --profile ci
      - uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: lcov.info
          flags: rust
          fail_ci_if_error: false
      # cargo-llvm-cov redirects the target dir, so match the JUnit file by glob.
      - uses: codecov/test-results-action@0fa95f0e1eeaafde2c782583b36b28ad0d8c77d3 # v1
        if: ${{ !cancelled() }}
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: target/llvm-cov-target/nextest/ci/junit.xml,target/nextest/ci/junit.xml
          flags: rust
          fail_ci_if_error: false

  wasm:
    name: wasm (wasm32 check)
    runs-on: ubuntu-latest
    env:
      MISE_ENV: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: jdx/mise-action@7a4e45a543138629540c9a1616d08632b893e492 # v5
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # A mise cache hit can skip rustup target installation.
      - run: rustup target add wasm32-unknown-unknown
      - run: mise run check-wasm-core
      - run: mise run check-wasm-ui
      - run: mise run check-wasm-decode
      - run: mise run check-wasm-worker
      - run: mise run build-web
      - run: |
          test -f crates/gashuu/dist/index.html
          test -f crates/gashuu/dist/gashuu-worker_bg.wasm
          test -f crates/gashuu/dist/gashuu-worker_loader.js
          ls crates/gashuu/dist/*.wasm

  # Doc-structure harness: enforces the L1 (CLAUDE.md <=35 lines) + link integrity
  # invariants, plus the visual-token and macOS release packaging guards.
  # Pure bash, no toolchain — runs the same scripts as the local
  # `mise run check-docs` / `mise run check-tokens` /
  # `mise run check-release-macos-dist` / `mise run check-dav1d-pin` tasks.
  docs:
    name: docs (structure check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - run: bash scripts/check-docs.sh
      - run: bash scripts/check-tokens.sh
      - run: bash scripts/check-release-macos-dist.sh
      - run: bash scripts/check-release-linux-dist.sh
      - run: bash scripts/check-dav1d-pin.sh

  # The Slint app and portable worker tests run per OS. The core job covers
  # gashuu-core and formatting. Clippy for the app and worker runs on Linux.
  app:
    name: app (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: jdx/mise-action@7a4e45a543138629540c9a1616d08632b893e492 # v5
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # Slint's winit + femtovg backend links these system libraries on Linux;
      # libdav1d-dev backs the image crate's AVIF decode (avif-native feature).
      - if: runner.os == 'Linux'
        name: Install system libraries + dav1d (apt)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libfontconfig1-dev libfreetype6-dev libxcb1-dev \
            libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev \
            libdav1d-dev
      # dav1d for the non-Linux legs. The SYSTEM_DEPS_* env overrides point the
      # dav1d-sys build directly at the library, bypassing pkg-config (not
      # reliably on PATH on these runners). See docs/toolchain.md.
      - if: runner.os == 'macOS'
        name: Install dav1d (brew)
        run: |
          brew install dav1d
          PREFIX="$(brew --prefix dav1d)"
          {
            echo "SYSTEM_DEPS_DAV1D_NO_PKG_CONFIG=1"
            echo "SYSTEM_DEPS_DAV1D_LIB=dav1d"
            echo "SYSTEM_DEPS_DAV1D_SEARCH_NATIVE=$PREFIX/lib"
            echo "SYSTEM_DEPS_DAV1D_INCLUDE=$PREFIX/include"
          } >> "$GITHUB_ENV"
      # Windows: dav1d is built from source at the pinned DAV1D_VERSION by the SAME
      # composite action the release job uses, so CI compiles dav1d exactly as the
      # release does. Its cache key carries the runner image version, so an image
      # update (new MSVC) forces a cold build here first. See the action's header.
      - if: runner.os == 'Windows'
        name: Build dav1d (pinned source, static)
        uses: ./.github/actions/build-dav1d-windows
        with:
          version: ${{ env.DAV1D_VERSION }}
      - run: rustup component add clippy
      # UI lint once (Linux leg); add per-OS clippy only when cfg(os) code appears.
      - if: matrix.os == 'ubuntu-latest'
        run: cargo clippy -p gashuu -p gashuu-worker --all-targets -- -D warnings
      # Exercise AVIF decode against the Windows static dav1d: the core job only
      # covers apt's dav1d on Linux, and the release links this exact build.
      - if: runner.os == 'Windows'
        name: AVIF decode against the static dav1d
        run: cargo nextest run -p gashuu-core --features testing --profile ci -E 'test(/avif/)'
      - run: cargo nextest run -p gashuu -p gashuu-worker --profile ci
      - uses: codecov/test-results-action@0fa95f0e1eeaafde2c782583b36b28ad0d8c77d3 # v1
        if: ${{ !cancelled() }}
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: target/nextest/ci/junit.xml
          flags: app-${{ matrix.os }}
          fail_ci_if_error: false

  # The landing site (site/): a pnpm + Vite + React + TS app. node + pnpm are
  # pinned by site/mise.toml; the gate runs Biome, tsc, Knip and a production
  # build. Independent of the Rust gates. Runs on every PR (like core/app) — the
  # job is small and self-contained, so no path filtering is added.
  site:
    name: site (vite/react)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # install: false — do NOT auto-install the repo-root mise.toml's Rust
      # toolchain. The site toolchain (node + pnpm) is in site/mise.toml and is
      # installed below from the site working directory.
      - uses: jdx/mise-action@7a4e45a543138629540c9a1616d08632b893e492 # v5
        with:
          install: false
      - run: mise trust && mise install
      - run: mise exec -- pnpm install --frozen-lockfile
      - run: mise run check

name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Cancel a superseded run when a new commit lands on the same ref (saves CI minutes).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The Slint-free pure crate: lint + test + coverage in one fast ubuntu job.
  # It never links Slint, so the quality gates return quickly instead of waiting
  # on the GUI build, and gashuu-core is tested/measured exactly once.
  core:
    name: core (rust, slint-free)
    runs-on: ubuntu-latest
    # Activate mise.coverage.toml so cargo-llvm-cov is installed here only; the
    # per-OS app jobs (no MISE_ENV) skip it and stay lean. See mise.coverage.toml.
    env:
      MISE_ENV: coverage
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: jdx/mise-action@9e7f7633ff6f6d6048a9418a68d48f288f50eb14 # v4
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # gashuu-core's `image` dep decodes AVIF through the dav1d C library
      # (`avif-native` feature), resolved via pkg-config. Ubuntu 24.04 ships
      # 1.4.1 (>= the 1.3.0 floor). See docs/toolchain.md.
      - run: |
          sudo apt-get update
          sudo apt-get install -y libdav1d-dev
      # Install all three components explicitly on mise's pinned toolchain:
      # llvm-tools-preview (for cargo-llvm-cov; mise.toml omits it) plus rustfmt and
      # clippy. rustfmt/clippy ARE declared in mise.toml, but on a mise cache hit
      # jdx/mise-action restores symlinks WITHOUT re-running `rustup component add`,
      # so they can be missing from ~/.rustup on the runner — keep them here or
      # `cargo fmt --check`/clippy fail in this (coverage) job. Do not drop as "redundant".
      - run: rustup component add rustfmt clippy llvm-tools-preview
      - run: cargo fmt --check
      # `--features testing` so the feature-gated MockPageSource test is linted and run
      # (the old `--workspace` runs got it via feature unification with gashuu's dev-dep).
      - run: cargo clippy -p gashuu-core --all-targets --features testing -- -D warnings
      - run: cargo llvm-cov nextest -p gashuu-core --features testing --profile ci --lcov --output-path lcov.info --ignore-filename-regex 'build\.rs'
      - uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: lcov.info
          flags: rust
          fail_ci_if_error: false

  # Doc-structure harness: enforces the L1 (CLAUDE.md <=35 lines) + link integrity
  # invariants, plus the visual-token and macOS release packaging guards.
  # Pure bash, no toolchain — runs the same scripts as the local
  # `mise run check-docs` / `mise run check-tokens` /
  # `mise run check-release-macos-dist` tasks.
  docs:
    name: docs (structure check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - run: bash scripts/check-docs.sh
      - run: bash scripts/check-tokens.sh
      - run: bash scripts/check-release-macos-dist.sh
      - run: bash scripts/check-release-linux-dist.sh

  # The Slint presentation crate, built and tested per OS. Only `-p gashuu` runs
  # here (the core job already covers gashuu-core), and fmt/clippy are not repeated
  # on every OS. clippy for the UI runs once on Linux.
  app:
    name: app (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: jdx/mise-action@9e7f7633ff6f6d6048a9418a68d48f288f50eb14 # v4
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # Slint's winit + femtovg backend links these system libraries on Linux;
      # libdav1d-dev backs the image crate's AVIF decode (avif-native feature).
      - if: runner.os == 'Linux'
        name: Install system libraries + dav1d (apt)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libfontconfig1-dev libfreetype6-dev libxcb1-dev \
            libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev \
            libdav1d-dev
      # dav1d for the non-Linux legs. The SYSTEM_DEPS_* env overrides point the
      # dav1d-sys build directly at the library, bypassing pkg-config (not
      # reliably on PATH on these runners). See docs/toolchain.md.
      - if: runner.os == 'macOS'
        name: Install dav1d (brew)
        run: |
          brew install dav1d
          PREFIX="$(brew --prefix dav1d)"
          {
            echo "SYSTEM_DEPS_DAV1D_NO_PKG_CONFIG=1"
            echo "SYSTEM_DEPS_DAV1D_LIB=dav1d"
            echo "SYSTEM_DEPS_DAV1D_SEARCH_NATIVE=$PREFIX/lib"
            echo "SYSTEM_DEPS_DAV1D_INCLUDE=$PREFIX/include"
          } >> "$GITHUB_ENV"
      # Windows: vcpkg compiles dav1d from source in ~3.5 min on a cold cache, so
      # the INSTALLED TREE is cached and `vcpkg install` is skipped outright on a
      # hit. Two traps are encoded in the three steps below — do not undo either.
      #
      # TRAP 1 — why the installed tree and not `~\AppData\Local\vcpkg\archives`:
      # `actions/cache` NEVER re-saves an entry whose key already hit, and vcpkg
      # addresses its binary archives by package ABI hash (port version + vcpkg tool
      # version + compiler hash). So the moment the hosted image moved, the frozen
      # archive stopped matching — `Restored 0 package(s)`, full source rebuild on
      # every run, and no way to recover, because the freshly built archive was
      # never uploaded. The installed tree is content we consume directly, so a hit
      # is usable regardless of ABI hashes; a stale key at worst pins an older dav1d.
      #
      # TRAP 2 — why the path needs its own step: `VCPKG_INSTALLATION_ROOT` is set
      # by the runner image, NOT by the workflow, so it is invisible to workflow
      # `${{ env.<NAME> }}` expressions. Used directly in `path:` it silently expands
      # to a bare relative `\installed\x64-windows-static-md`. It must be re-exported
      # through GITHUB_ENV first, which is all this step does.
      - if: runner.os == 'Windows'
        name: Resolve the vcpkg installed-tree path
        shell: pwsh
        run: |
          "VCPKG_DAV1D_ROOT=$Env:VCPKG_INSTALLATION_ROOT\installed\x64-windows-static-md" |
            Out-File -FilePath $Env:GITHUB_ENV -Append
      # The key names the dav1d version and triplet so a vcpkg baseline bump is a NEW
      # key instead of a stale hit; bump the version by hand when the runner image's
      # dav1d moves. Deliberately NO `restore-keys`: a prefix match restores the tree
      # yet reports `cache-hit != 'true'`, so `vcpkg install` would then run against
      # a directory that already holds those files and abort on a file conflict.
      - if: runner.os == 'Windows'
        id: dav1d-cache
        name: Cache the vcpkg-installed dav1d tree
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ${{ env.VCPKG_DAV1D_ROOT }}
          key: vcpkg-installed-dav1d-1.5.3-x64-windows-static-md
      - if: runner.os == 'Windows' && steps.dav1d-cache.outputs.cache-hit != 'true'
        name: Build dav1d (vcpkg, static)
        shell: pwsh
        run: vcpkg install dav1d:x64-windows-static-md
      # Split from the build step because it must run on BOTH the hit and the miss
      # path: it points dav1d-sys at the restored-or-just-built tree. Static lib, so
      # no DLL is needed at test time.
      - if: runner.os == 'Windows'
        name: Point dav1d-sys at the installed tree
        shell: pwsh
        run: |
          @(
            "SYSTEM_DEPS_DAV1D_NO_PKG_CONFIG=1",
            "SYSTEM_DEPS_DAV1D_LINK=static",
            "SYSTEM_DEPS_DAV1D_LIB=dav1d",
            "SYSTEM_DEPS_DAV1D_SEARCH_NATIVE=$Env:VCPKG_DAV1D_ROOT\lib",
            "SYSTEM_DEPS_DAV1D_INCLUDE=$Env:VCPKG_DAV1D_ROOT\include"
          ) | Out-File -FilePath $Env:GITHUB_ENV -Append
      - run: rustup component add clippy
      # UI lint once (Linux leg); add per-OS clippy only when cfg(os) code appears.
      - if: matrix.os == 'ubuntu-latest'
        run: cargo clippy -p gashuu --all-targets -- -D warnings
      - run: cargo nextest run -p gashuu --profile ci

  # The landing site (site/): a pnpm + Vite + React + TS app. node + pnpm are
  # pinned by site/mise.toml; the gate runs Biome, tsc, Knip and a production
  # build. Independent of the Rust gates. Runs on every PR (like core/app) — the
  # job is small and self-contained, so no path filtering is added.
  site:
    name: site (vite/react)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # install: false — do NOT auto-install the repo-root mise.toml's Rust
      # toolchain. The site toolchain (node + pnpm) is in site/mise.toml and is
      # installed below from the site working directory.
      - uses: jdx/mise-action@9e7f7633ff6f6d6048a9418a68d48f288f50eb14 # v4
        with:
          install: false
      - run: mise trust && mise install
      - run: mise exec -- pnpm install --frozen-lockfile
      - run: mise run check

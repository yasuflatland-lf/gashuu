<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <title>gashuu</title>
    <link data-trunk rel="rust" data-bin="gashuu" data-wasm-opt="z" />
    <link data-trunk rel="rust" href="../gashuu-worker/Cargo.toml" data-type="worker" data-bin="gashuu-worker" data-loader-shim data-wasm-opt="z" />
    <link data-trunk rel="copy-dir" href="web/fonts" />
    <link rel="preload" href="fonts/NotoSansJP-gashuu-subset.ttf" as="fetch" type="font/ttf" crossorigin>
    <script>
      window.addEventListener("error", (event) => {
        if (event.error?.message?.startsWith("Using exceptions for control flow,")) {
          event.preventDefault();
        }
      });
    </script>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: black;
        /* Keep touch gestures in the app instead of the browser. */
        touch-action: none;
        overscroll-behavior: none;
      }
      #canvas {
        display: block;
        width: 100vw;
        height: 100vh;
        /* Override the inline minimum window size on narrow or short viewports. */
        min-width: 0 !important;
        min-height: 0 !important;
        outline: none;
        touch-action: none;
        -webkit-touch-callout: none;
        -webkit-user-select: none;
        user-select: none;
      }
    </style>
  </head>
  <body>
    <canvas id="canvas"></canvas>
  </body>
</html>

[package]
name = "gashuu-worker"
version = "1.3.0"
edition = "2021"
license = "MIT"
publish = false

[lib]
path = "src/lib.rs"

[[bin]]
name = "gashuu-worker"
path = "src/main.rs"

[dependencies]
gashuu-core = { path = "../gashuu-core", default-features = false }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"

[target.'cfg(target_arch = "wasm32")'.dependencies]
console_error_panic_hook = "0.1"
gashuu-web-decode = { path = "../gashuu-web-decode" }
getrandom = { version = "0.4", features = ["wasm_js"] }
js-sys = "0.3"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = [
    "DedicatedWorkerGlobalScope", "WorkerGlobalScope", "WorkerNavigator", "StorageManager",
    "FileSystemDirectoryHandle", "FileSystemGetDirectoryOptions", "FileSystemFileHandle",
    "FileSystemSyncAccessHandle", "FileSystemReadWriteOptions", "MessageEvent", "DomException",
    "File", "Blob", "FileReaderSync", "Crypto", "FileSystemGetFileOptions", "FileSystemRemoveOptions",
    "console",
] }

[dev-dependencies]
zip = { version = "9", default-features = false, features = ["deflate"] }
image = { version = "0.25", default-features = false, features = ["png"] }
